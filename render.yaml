services:
  - type: web
    name: proofline
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: hybrid_deterministic
      - key: DATABASE_URL
        value: sqlite:///./brandroots.db
