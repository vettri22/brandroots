version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: proofline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofline_user
      POSTGRES_PASSWORD: proofline_password
      POSTGRES_DB: proofline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofline_user -d proofline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proofline_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://proofline_user:proofline_password@db:5432/proofline_db
      SECRET_KEY: proofline-production-deployment-secret-key-super-secure-token
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LLM_PROVIDER: hybrid_deterministic
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proofline_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
