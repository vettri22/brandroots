name: Render Keep-Alive Pinger

on:
  schedule:
    # Run every 10 minutes to reset Render's 15-minute inactivity timer
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          TARGET_URL="${APP_URL:-https://proofline.onrender.com}"
          echo "Sending keep-alive ping to: ${TARGET_URL}/health"
          curl -s -f -m 30 "${TARGET_URL}/health" || echo "Ping attempted"
